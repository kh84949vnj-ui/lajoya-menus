name: Update menus

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~6:17am Central (UTC time)
  workflow_dispatch:         # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python lajoya_menus.py --out-dir output
      - name: Commit CSV if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add output/menus.csv
          git diff --cached --quiet || git commit -m "Update menus $(date -u +%F)"
          git push
